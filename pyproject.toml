[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maps-ai-pipeline"
version = "0.1.0"
description = "Local synthetic dictionary-first recommendation pipeline"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["maps_ai_pipeline*"]
exclude = ["tests*", "examples*"]
